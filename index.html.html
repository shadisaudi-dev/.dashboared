<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة متابعة البرنامج الوطني للتشغيل</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--tx:#0f1f3d;--mu:#64718a;--bd:#e3e8f0;--a:#ee7728}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e8edf6;--mu:#93a0b8;--bd:#223049;--a:#f58a42}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e8edf6;--mu:#93a0b8;--bd:#223049;--a:#f58a42}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.lock{font-size:40px}h1{font-size:18px;margin:8px 0 4px}p{color:var(--mu);font-size:14px;margin:0 0 18px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx);text-align:center;direction:ltr}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--a);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6}#err{color:#d33;font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>

function d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function open_(){
 var btn=document.getElementById('go'),err=document.getElementById('err');err.textContent='';btn.disabled=true;
 try{
  var pw=document.getElementById('pw').value;
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(S),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(I)},k,d(C));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
 }catch(e){err.textContent='كلمة المرور غير صحيحة';btn.disabled=false}
}
document.getElementById('go').onclick=open_;
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')open_()});
</script></body></html>
